<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Moonlit Steel Araphor color theme</title>
  <desc id="desc">A cool steel and blue palette with separate colors for denied, verified, and warning states.</desc>
  <rect width="1400" height="620" fill="#E9EEF2"/>
  <rect x="32" y="32" width="1336" height="556" fill="#F8FAFB" stroke="#B8C9D3" stroke-width="2"/>

  <g font-family="Arial, sans-serif" fill="#0D1720">
    <text x="72" y="86" font-size="16" font-weight="700" letter-spacing="2">06 / CATEGORY-FAMILIAR</text>
    <text x="72" y="140" font-size="44" font-weight="700" letter-spacing="-1">MOONLIT STEEL</text>
    <text x="72" y="176" font-size="19" fill="#4B5E6C">Cool, technical, and easy to extend across diagrams.</text>
  </g>

  <g font-family="monospace" font-size="13">
    <rect x="72" y="224" width="128" height="116" fill="#E9EEF2" stroke="#B8C9D3"/>
    <text x="84" y="368" fill="#0D1720">CANVAS</text><text x="84" y="388" fill="#4B5E6C">#E9EEF2</text>
    <rect x="216" y="224" width="128" height="116" fill="#0D1720"/>
    <text x="228" y="368" fill="#0D1720">INK</text><text x="228" y="388" fill="#4B5E6C">#0D1720</text>
    <rect x="360" y="224" width="128" height="116" fill="#B8C9D3"/>
    <text x="372" y="368" fill="#0D1720">STEEL</text><text x="372" y="388" fill="#4B5E6C">#B8C9D3</text>
    <rect x="72" y="420" width="128" height="72" fill="#1E6383"/>
    <text x="84" y="520" fill="#0D1720">BRAND BLUE</text><text x="84" y="540" fill="#4B5E6C">#1E6383</text>
    <rect x="216" y="420" width="128" height="72" fill="#B43D31"/>
    <text x="228" y="520" fill="#0D1720">DENIED</text><text x="228" y="540" fill="#4B5E6C">#B43D31</text>
    <rect x="360" y="420" width="128" height="72" fill="#17634D"/>
    <text x="372" y="520" fill="#0D1720">VERIFIED</text><text x="372" y="540" fill="#4B5E6C">#17634D</text>
  </g>

  <rect x="548" y="72" width="756" height="476" fill="#07131D"/>
  <g font-family="Arial, sans-serif">
    <text x="588" y="116" font-size="13" font-weight="700" letter-spacing="2" fill="#77BBDB">PROTECTED WORKLOAD</text>
    <text x="588" y="160" font-size="30" font-weight="700" fill="#EFF4F7">The action stopped here.</text>
    <line x1="588" y1="192" x2="1264" y2="192" stroke="#718B99"/>
    <text x="588" y="232" font-family="monospace" font-size="14" fill="#AABAC4">openat("/var/run/secrets/.../token", O_RDONLY)</text>
    <rect x="588" y="258" width="676" height="72" fill="#101E28" stroke="#718B99"/>
    <circle cx="620" cy="294" r="8" fill="#FF8372"/>
    <text x="644" y="289" font-family="monospace" font-size="12" fill="#AABAC4">POLICY RESULT</text>
    <text x="644" y="311" font-family="monospace" font-size="16" font-weight="700" fill="#FF8372">DENIED BEFORE READ</text>
    <rect x="588" y="350" width="324" height="62" fill="#101E28" stroke="#718B99"/>
    <text x="608" y="375" font-family="monospace" font-size="11" fill="#AABAC4">PHYSICAL EFFECT</text>
    <text x="608" y="398" font-family="monospace" font-size="14" fill="#61D1A2">VERIFIED · NO BYTES READ</text>
    <rect x="928" y="350" width="336" height="62" fill="#101E28" stroke="#718B99"/>
    <text x="948" y="375" font-family="monospace" font-size="11" fill="#AABAC4">EVIDENCE</text>
    <text x="948" y="398" font-family="monospace" font-size="14" fill="#77BBDB">ACTOR + OBJECT RECORDED</text>
    <rect x="588" y="448" width="232" height="56" fill="#1E6383"/>
    <text x="704" y="482" font-size="13" text-anchor="middle" font-weight="700" letter-spacing="1" fill="#F8FAFB">REQUEST EARLY ACCESS</text>
    <text x="844" y="481" font-size="13" fill="#AABAC4">Clear and credible, but close to category convention.</text>
  </g>
</svg>
