<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Black Steel color theme</title>
  <desc id="desc">A dark graphite palette where silver is the primary brand signal and bright colors mark system results.</desc>
  <rect width="1400" height="620" fill="#080B0A"/>
  <rect x="32" y="32" width="1336" height="556" fill="#111714" stroke="#8FA9A2" stroke-width="2"/>

  <g font-family="Arial, sans-serif" fill="#EDF2EF">
    <text x="72" y="86" font-size="16" font-weight="700" letter-spacing="2" fill="#8FA9A2">07 / DARK-FIRST</text>
    <text x="72" y="140" font-size="44" font-weight="700" letter-spacing="-1">BLACK STEEL</text>
    <text x="72" y="176" font-size="19" fill="#A7B5AF">Silver carries the brand. Bright color is evidence, not decoration.</text>
  </g>

  <g font-family="monospace" font-size="13">
    <rect x="72" y="224" width="128" height="116" fill="#080B0A" stroke="#8FA9A2"/>
    <text x="84" y="368" fill="#EDF2EF">CANVAS</text><text x="84" y="388" fill="#A7B5AF">#080B0A</text>
    <rect x="216" y="224" width="128" height="116" fill="#EDF2EF"/>
    <text x="228" y="368" fill="#EDF2EF">TEXT</text><text x="228" y="388" fill="#A7B5AF">#EDF2EF</text>
    <rect x="360" y="224" width="128" height="116" fill="#CBD5D1"/>
    <text x="372" y="368" fill="#EDF2EF">BRAND METAL</text><text x="372" y="388" fill="#A7B5AF">#CBD5D1</text>
    <rect x="72" y="420" width="128" height="72" fill="#8FA9A2"/>
    <text x="84" y="520" fill="#EDF2EF">MINERAL</text><text x="84" y="540" fill="#A7B5AF">#8FA9A2</text>
    <rect x="216" y="420" width="128" height="72" fill="#FF775D"/>
    <text x="228" y="520" fill="#EDF2EF">DENIED</text><text x="228" y="540" fill="#A7B5AF">#FF775D</text>
    <rect x="360" y="420" width="128" height="72" fill="#5BC99C"/>
    <text x="372" y="520" fill="#EDF2EF">VERIFIED</text><text x="372" y="540" fill="#A7B5AF">#5BC99C</text>
  </g>

  <rect x="548" y="72" width="756" height="476" fill="#080B0A" stroke="#19221E"/>
  <g font-family="Arial, sans-serif">
    <text x="588" y="116" font-size="13" font-weight="700" letter-spacing="2" fill="#8FA9A2">PROTECTED WORKLOAD</text>
    <text x="588" y="160" font-size="30" font-weight="700" fill="#EDF2EF">The action stopped here.</text>
    <line x1="588" y1="192" x2="1264" y2="192" stroke="#8FA9A2"/>
    <text x="588" y="232" font-family="monospace" font-size="14" fill="#A7B5AF">openat("/var/run/secrets/.../token", O_RDONLY)</text>
    <rect x="588" y="258" width="676" height="72" fill="#19221E" stroke="#8FA9A2"/>
    <circle cx="620" cy="294" r="8" fill="#FF775D"/>
    <text x="644" y="289" font-family="monospace" font-size="12" fill="#A7B5AF">POLICY RESULT</text>
    <text x="644" y="311" font-family="monospace" font-size="16" font-weight="700" fill="#FF775D">DENIED BEFORE READ</text>
    <rect x="588" y="350" width="324" height="62" fill="#19221E" stroke="#8FA9A2"/>
    <text x="608" y="375" font-family="monospace" font-size="11" fill="#A7B5AF">PHYSICAL EFFECT</text>
    <text x="608" y="398" font-family="monospace" font-size="14" fill="#5BC99C">VERIFIED · NO BYTES READ</text>
    <rect x="928" y="350" width="336" height="62" fill="#19221E" stroke="#8FA9A2"/>
    <text x="948" y="375" font-family="monospace" font-size="11" fill="#A7B5AF">EVIDENCE</text>
    <text x="948" y="398" font-family="monospace" font-size="14" fill="#7FB9CF">ACTOR + OBJECT RECORDED</text>
    <rect x="588" y="448" width="232" height="56" fill="#DCE6E2"/>
    <text x="704" y="482" font-size="13" text-anchor="middle" font-weight="700" letter-spacing="1" fill="#0B100E">REQUEST EARLY ACCESS</text>
    <text x="844" y="481" font-size="13" fill="#A7B5AF">Strong evidence view. Less distinct as a security site.</text>
  </g>
</svg>
